<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bảng Quản Lý Trạng Thái Hoàn Thành Đánh Giá - Kuchen Products</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --primary: #2563eb;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 10px;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 768px) {
      .header-card {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .header-title h1 {
      font-size: 19px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      line-height: 1.3;
    }

    .header-title p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .header-actions { width: auto; }
    }

    .live-pulse-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .kpi-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }

    .kpi-icon.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .kpi-icon.green { background: linear-gradient(135deg, #10b981, #047857); }
    .kpi-icon.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .kpi-info h2 { font-size: 22px; font-weight: 800; }
    .kpi-info p { font-size: 11px; color: var(--text-muted); font-weight: 700; }

    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .filter-card { flex-direction: row; align-items: center; }
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      font-size: 15px; /* 16px prevents iOS zoom */
      min-height: 46px;
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-md);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 650px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--card-border);
      text-align: left;
    }

    th { background: #f1f5f9; font-weight: 700; color: var(--text-muted); }

    .badge-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge-status.completed {
      background: rgba(5, 150, 105, 0.1);
      color: var(--success);
      border: 1px solid rgba(5, 150, 105, 0.3);
    }

    .badge-status.pending {
      background: rgba(217, 119, 6, 0.1);
      color: var(--warning);
      border: 1px solid rgba(217, 119, 6, 0.3);
    }

    .btn-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      word-break: break-word;
    }

    .btn-link:hover { text-decoration: underline; }

    .nav-btn {
      flex: 1;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }

    .btn-danger {
      flex: 1;
      padding: 10px 14px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      transition: background 0.2s ease;
    }

    .btn-danger:hover { background: var(--danger-hover); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header-card">
      <div class="header-title">
        <h1>
          <i class="fa-solid fa-chart-line" style="color: var(--primary);"></i> Dashboard Quản Lý Đánh Giá
          <span class="live-pulse-badge"><span class="pulse-dot"></span> Tự động đồng bộ 3s</span>
        </h1>
        <p>Thống kê chi tiết tiến độ hoàn thành đánh giá thực tế cho 128 sản phẩm Kuchen</p>
      </div>
      <div class="header-actions">
        <button id="btnResetDashboard" class="btn-danger"><i class="fa-solid fa-rotate-left"></i> Reset Bảng</button>
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Tool Gửi</a>
      </div>
    </header>

    <!-- KPI Cards -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon blue"><i class="fa-solid fa-boxes-stacked"></i></div>
        <div class="kpi-info">
          <h2 id="kpiTotal">128</h2>
          <p>TỔNG SẢN PHẨM</p>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div>
        <div class="kpi-info">
          <h2 id="kpiCompleted">0 (0%)</h2>
          <p>ĐÃ HOÀN THÀNH</p>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon orange"><i class="fa-solid fa-clock"></i></div>
        <div class="kpi-info">
          <h2 id="kpiPending">128</h2>
          <p>CHƯA ĐÁNH GIÁ</p>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filter-card">
      <div class="filter-group">
        <label><i class="fa-solid fa-user"></i> Người phụ trách:</label>
        <select id="staffFilter">
          <option value="ALL">-- Tất cả nhân viên (13 người) --</option>
        </select>
      </div>
      <div class="filter-group">
        <label><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm:</label>
        <input type="text" id="searchInput" placeholder="Nhập tên sản phẩm hoặc SKU...">
      </div>
    </section>

    <!-- Table -->
    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width: 45px;">STT</th>
            <th style="width: 120px;">Người phụ trách</th>
            <th>Tên Sản Phẩm</th>
            <th style="width: 130px;">Trạng Thái</th>
            <th style="width: 75px;">Đánh giá</th>
            <th>Nội Dung Đánh Giá</th>
            <th style="width: 130px;">Thời gian</th>
          </tr>
        </thead>
        <tbody id="statusTableBody">
          <!-- Dynamic Status Rows -->
        </tbody>
      </table>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const staffFilter = document.getElementById('staffFilter');
      const searchInput = document.getElementById('searchInput');
      const statusTableBody = document.getElementById('statusTableBody');
      const kpiTotal = document.getElementById('kpiTotal');
      const kpiCompleted = document.getElementById('kpiCompleted');
      const kpiPending = document.getElementById('kpiPending');
      const btnResetDashboard = document.getElementById('btnResetDashboard');

      let initialStatusData = [];
      let currentStatusData = [];

      try {
        const res = await fetch('completion_status.json');
        if (res.ok) {
          initialStatusData = await res.json();
        }
      } catch (e) {
        console.warn('Status file loading...');
      }

      async function loadAndMergeData() {
        currentStatusData = JSON.parse(JSON.stringify(initialStatusData));

        let globalCloudCompletions = {};

        // 1. Fetch Global Multi-user Completions from Cloudflare Worker Server
        try {
          const gRes = await fetch('/api/get-status');
          if (gRes.ok) {
            globalCloudCompletions = await gRes.json();
          }
        } catch (e) {}

        // 2. Fetch Local Completions from LocalStorage fallback
        let localCompletions = {};
        try {
          localCompletions = JSON.parse(localStorage.getItem('kuchen_completed_reviews') || '{}');
        } catch (err) {}

        const mergedCompletions = { ...localCompletions, ...globalCloudCompletions };

        currentStatusData.forEach(item => {
          const pid = item.productId || item.stt;
          if (mergedCompletions[pid]) {
            const loc = mergedCompletions[pid];
            item.status = 'HOÀN THÀNH';
            item.statusClass = 'completed';
            item.reviewContent = loc.reviewContent;
            item.reviewerName = loc.reviewerName;
            item.reviewerPhone = loc.reviewerPhone;
            item.rating = loc.rating || 5;
            item.completedAt = loc.completedAt;
          }
        });

        renderTable(currentStatusData);
      }

      // Populate Staff Filter
      function populateStaffFilter() {
        staffFilter.innerHTML = '<option value="ALL">-- Tất cả nhân viên (13 người) --</option>';
        const staffNames = Array.from(new Set(initialStatusData.map(d => d.assignee)));
        staffNames.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = `👤 ${name}`;
          staffFilter.appendChild(opt);
        });
      }

      function renderTable(data) {
        statusTableBody.innerHTML = '';
        const completedCount = data.filter(d => d.status === 'HOÀN THÀNH').length;
        const pendingCount = data.length - completedCount;

        kpiTotal.textContent = data.length;
        kpiCompleted.textContent = `${completedCount} (${Math.round((completedCount/data.length)*100 || 0)}%)`;
        kpiPending.textContent = pendingCount;

        data.forEach(item => {
          const isDone = item.status === 'HOÀN THÀNH';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${item.stt}</strong></td>
            <td><span style="font-weight:600; color:#2563eb;">👤 ${item.assignee}</span></td>
            <td>
              <a href="${item.url}" target="_blank" class="btn-link">${item.name}</a>
              <div style="font-size:11px; color:#64748b;">SKU: ${item.sku || 'N/A'} (ID: ${item.productId || 'N/A'})</div>
            </td>
            <td>
              ${isDone ? `
                <span class="badge-status completed">
                  <i class="fa-solid fa-circle-check"></i> HOÀN THÀNH
                </span>
              ` : `
                <span class="badge-status pending">
                  <i class="fa-solid fa-clock"></i> CHƯA ĐÁNH GIÁ
                </span>
              `}
            </td>
            <td><span style="color:${isDone ? '#d97706' : '#94a3b8'}; font-weight:700;">${isDone ? item.rating + ' ★' : '-'}</span></td>
            <td style="font-size:12px; color:#334155;">
              <div>${isDone ? `<em>"${item.reviewContent}"</em>` : '<span style="color:#94a3b8;">Chưa có nhận xét</span>'}</div>
              ${isDone ? `<div style="font-size:11px; color:#64748b; margin-top:2px;">Người gửi: ${item.reviewerName} (${item.reviewerPhone})</div>` : ''}
            </td>
            <td style="font-size:12px; color:#64748b;">${item.completedAt}</td>
          `;
          statusTableBody.appendChild(tr);
        });
      }

      populateStaffFilter();
      await loadAndMergeData();

      // Auto-poll every 3 seconds to update real-time completions automatically without F5
      setInterval(async () => {
        await loadAndMergeData();
      }, 3000);

      // Filter events
      staffFilter.addEventListener('change', filterData);
      searchInput.addEventListener('input', filterData);

      function filterData() {
        const staff = staffFilter.value;
        const query = searchInput.value.toLowerCase().trim();

        const filtered = currentStatusData.filter(d => {
          const matchStaff = staff === 'ALL' || d.assignee === staff;
          const matchQuery = !query || d.name.toLowerCase().includes(query) || (d.sku && d.sku.toLowerCase().includes(query));
          return matchStaff && matchQuery;
        });

        renderTable(filtered);
      }

      // Reset Button Handler with Global Sync & Password Verification: nxl2010@
      btnResetDashboard.addEventListener('click', async () => {
        const pass = prompt('🔐 VUI LÒNG NHẬP MẬT KHẨU ĐỂ RESET BẢNG ĐÁNH GIÁ CHUNG:');
        
        if (pass === null) return; // User cancelled

        if (pass === 'nxl2010@') {
          // Clear LocalStorage completion tracking
          localStorage.removeItem('kuchen_completed_reviews');

          // Reset Global Worker Status Database
          try {
            await fetch('/api/reset-status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: 'nxl2010@' })
            });
          } catch (e) {}

          // Reset all status to initial pending state
          initialStatusData.forEach(item => {
            item.status = 'CHƯA ĐÁNH GIÁ';
            item.statusClass = 'pending';
            item.reviewContent = 'Chưa có đánh giá';
            item.reviewerName = '-';
            item.reviewerPhone = '-';
            item.rating = 0;
            item.completedAt = '-';
          });

          await loadAndMergeData();
          alert('🎉 ĐÃ RESET TOÀN BỘ BẢNG ĐÁNH GIÁ TOÀN CẦU CHUNG CHO 13 NHÂN VIÊN VỀ 0% THÀNH CÔNG!');
        } else {
          alert('❌ Mật khẩu không chính xác! Không thể Reset dữ liệu.');
        }
      });
    });
  </script>
</body>
</html>
